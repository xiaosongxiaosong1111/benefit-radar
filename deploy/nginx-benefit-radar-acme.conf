server {
    listen 80;
    server_name benefit-radar.47-120-19-14.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/benefit-radar-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://benefit-radar.47-120-19-14.sslip.io$request_uri;
    }
}
