map $uri $benefitradar_auth_key {
    default "";
    ~^/api/auth/(login|register)$ $binary_remote_addr;
}
limit_req_zone $benefitradar_auth_key zone=benefitradar_auth:2m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=benefitradar_connections:2m;

server {
    listen 443 ssl;
    server_name benefit-radar.47-120-19-14.sslip.io;
    ssl_certificate /etc/letsencrypt/live/benefit-radar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/benefit-radar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BenefitRadarTLS:2m;
    ssl_session_timeout 10m;
    server_tokens off;

    if ($host != "benefit-radar.47-120-19-14.sslip.io") { return 444; }
    client_max_body_size 16k;
    client_body_timeout 10s;
    limit_req zone=benefitradar_auth burst=10 nodelay;
    limit_req_status 429;
    limit_conn benefitradar_connections 20;
    add_header Strict-Transport-Security "max-age=86400" always;

    location / {
        proxy_pass http://127.0.0.1:44173;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:44173;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 70s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    access_log /www/wwwlogs/benefit-radar.access.log;
    error_log /www/wwwlogs/benefit-radar.error.log;
}
